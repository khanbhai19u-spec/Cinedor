<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<title>Cinedor</title>
<link rel="preconnect" href="https://image.tmdb.org">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F12;--s1:#181A1F;--s2:#1F2128;--line:#262930;--text:#F4F4F6;--muted:#9CA0AA;--acc:#E879F9;--grad:linear-gradient(90deg,#A78BFA,#C026D3,#EC4899);--grad2:linear-gradient(135deg,#A78BFA,#C026D3,#EC4899);--glass:rgba(24,26,31,.88);--sk:#1D1F25;--shadow:0 10px 30px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#F6F5FA;--s1:#FFFFFF;--s2:#F0EEF6;--line:#E6E3EE;--text:#16151C;--muted:#6B6878;--acc:#C026D3;--glass:rgba(255,255,255,.9);--sk:#E9E6F0;--shadow:0 10px 30px rgba(40,20,60,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Outfit,'Hind Siliguri',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--acc);text-decoration:none}
img{display:block}
::-webkit-scrollbar{width:0;height:0}
.bn{font-family:'Hind Siliguri',Outfit,sans-serif}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top) + 8px) 0 calc(110px + env(safe-area-inset-bottom));display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#v-detail{padding-top:0;z-index:20;background:var(--bg)}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 4px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.5px}
.brand svg{width:34px;height:34px}
.rbtns{display:flex;gap:10px}
.cbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--text)}
.cbtn svg{width:20px;height:20px}
.hello{padding:12px 20px 0}
.hello small{display:block;font-size:14px;color:var(--muted)}
.hello b{font-size:20px;font-weight:700}
.ptitle{font-size:28px;font-weight:800;padding:10px 20px 14px;display:flex;align-items:center;gap:10px}

/* hero 16:9 */
.hero{margin:16px 20px 0;position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:var(--sk);border:1px solid var(--line)}
.hero .track{display:flex;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.slide{min-width:100%;height:100%;position:relative;cursor:pointer}
.slide img{width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(14,15,18,.95) 0%,rgba(14,15,18,.1) 70%)}
.slide .info{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff;display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;font-size:10.5px;font-weight:700;letter-spacing:1px;padding:4px 9px;border-radius:20px;background:var(--grad);color:#fff}
.slide h1{font-size:21px;font-weight:800;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .meta{font-size:12px;color:#C9CCD3}
.hb{display:flex;gap:8px;margin-top:2px}
.gbtn{height:40px;padding:0 18px;border-radius:12px;background:var(--grad);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.gbtn svg{width:15px;height:15px}
.obtn{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center}
.obtn svg{width:18px;height:18px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots span{width:6px;height:6px;border-radius:6px;background:var(--line);transition:.3s}
.dots span.on{width:22px;background:var(--acc)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 0}
.chip{flex:0 0 auto;height:38px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--s1);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}

.row{margin-top:24px}
.rowh{display:flex;justify-content:space-between;align-items:center;padding:0 20px 12px}
.rowh h2{font-size:18px;font-weight:700}
.see{font-size:13px;font-weight:600;color:var(--acc)}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:0 20px 2px;scroll-snap-type:x proximity}
.scroller .card{width:118px;flex:0 0 auto;scroll-snap-align:start}

.card{cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0}
.card:active{transform:scale(.97)}
.pimg{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--sk);border:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.pimg img.ld{opacity:1}
.noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;font-size:12px;color:var(--muted)}
.rate{position:absolute;top:8px;left:8px;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:8px;background:rgba(0,0,0,.62);color:#FCD34D}
.rank{position:absolute;left:0;top:0;padding:6px 11px;border-bottom-right-radius:14px;background:var(--grad2);font-size:16px;font-weight:800;color:#fff}
.free{position:absolute;right:7px;top:7px;font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:7px;background:#10B981;color:#fff}
.tvb{position:absolute;right:7px;top:7px;font-size:9.5px;font-weight:700;padding:3px 6px;border-radius:7px;background:rgba(0,0,0,.6);color:#fff}
.ct{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cy{font-size:11px;color:var(--muted);margin-top:-4px}
.cw{width:210px;flex:0 0 auto;display:flex;flex-direction:column;gap:7px;cursor:pointer}
.cw .th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--sk)}
.cw .th img{width:100%;height:100%;object-fit:cover}
.cw .pl{position:absolute;inset:0;display:grid;place-items:center}
.cw .pl span{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center}
.cw .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.18)}
.cw .bar i{display:block;height:4px;background:var(--grad)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:0 20px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
.sentinel{height:70px;display:grid;place-items:center}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,var(--sk) 0%,var(--s2) 50%,var(--sk) 100%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
.err{margin:24px 20px;text-align:center;color:var(--muted);font-size:14px}
.err .gbtn{margin-top:12px}

/* explore */
.sbox{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 16px;margin:0 20px;border-radius:16px;background:var(--s1);border:1px solid var(--line)}
.sbox input{flex:1;border:0;outline:none;background:none;font-size:15px;min-width:0;-webkit-user-select:text;user-select:text}
.sbox svg{width:20px;height:20px;stroke:var(--muted)}
.sec2{font-size:17px;font-weight:700;padding:22px 20px 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.tile{height:92px;border-radius:18px;display:flex;align-items:flex-end;padding:12px 14px;font-size:16px;font-weight:700;color:#fff;text-align:left;border:1px solid rgba(255,255,255,.06)}
.recent{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.recent button{font-size:13px;padding:8px 12px;border-radius:12px;background:var(--s1);color:var(--text);border:1px solid var(--line)}

/* detail */
.dhero{position:relative;width:100%;aspect-ratio:16/9;max-height:56vh;background:var(--sk);overflow:hidden}
.dhero img{width:100%;height:100%;object-fit:cover}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,transparent 60%)}
.dback{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center}
.bigplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:64px;height:64px;border-radius:50%;background:var(--grad2);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 10px rgba(217,70,239,.18)}
.bigplay svg{width:24px;height:24px;margin-left:3px}
.dbody{padding:0 20px;margin-top:-6px;position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}
.dbody h1{font-size:27px;font-weight:800;line-height:1.12}
.dmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dmeta .st{color:#FCD34D;font-weight:700}
.pill{padding:2px 8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600}
.pill.hd{background:rgba(217,70,239,.14);border-color:transparent;color:var(--acc)}
.gen{display:flex;gap:8px;flex-wrap:wrap}
.gen span{font-size:12px;padding:5px 12px;border-radius:20px;background:var(--s1);border:1px solid var(--line)}
.dbtns{display:flex;gap:10px;padding:16px 20px 0}
.dbtns .gbtn,.dbtns .sbtn{flex:1;height:50px;border-radius:14px;font-size:15px}
.sbtn{border:1px solid var(--line);background:var(--s1);color:var(--text);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.acts{display:flex;justify-content:space-around;padding:18px 10px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);min-width:64px;min-height:44px}
.act svg{color:var(--text)}
.act.on svg{color:var(--acc)}
.blk{padding:20px 20px 0}
.blk h2{font-size:17px;font-weight:700;margin-bottom:10px}
.ov{font-size:14px;line-height:1.7;color:var(--text);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ov.open{display:block}
.more{font-size:13.5px;font-weight:600;color:var(--acc);margin-top:6px}
.cast{display:flex;gap:12px;overflow-x:auto;padding:0 20px}
.person{width:72px;flex:0 0 auto;text-align:center}
.person .ph{width:64px;height:64px;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--sk);border:2px solid var(--line)}
.person .ph img{width:100%;height:100%;object-fit:cover}
.person p{font-size:12px;font-weight:600;margin-top:6px;line-height:1.2}
.person small{font-size:10.5px;color:var(--muted);display:block}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.prow em{font-style:normal;font-size:12px;color:var(--muted);width:52px}
.prow img{width:44px;height:44px;border-radius:12px}
.freecard{margin:18px 20px 0;padding:14px 16px;border-radius:16px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);display:flex;align-items:center;gap:12px;text-align:left;width:calc(100% - 40px);color:var(--text)}
.freecard b{display:block;font-size:14.5px}
.freecard small{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 20px 14px}
.tabs button{padding-bottom:10px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--text);font-weight:700;border-color:var(--acc)}
.sel{width:100%;padding:12px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);outline:none;font-size:14px;margin-bottom:10px}
.ep{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:var(--text)}
.ep .st{width:128px;flex:0 0 auto;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--sk);position:relative}
.ep .st img{width:100%;height:100%;object-fit:cover}
.ep h4{font-size:13.5px;font-weight:600}
.ep small{font-size:11.5px;color:var(--muted)}
.ep p{font-size:12px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* profile */
.pcard{margin:0 20px;border-radius:24px;padding:20px;background:linear-gradient(135deg,#2E1065 0%,#4A044E 55%,#500724 100%);color:#fff;display:flex;flex-direction:column;gap:18px}
.pav{display:flex;align-items:center;gap:14px}
.pav i{width:64px;height:64px;border-radius:20px;background:var(--grad2);display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:800}
.pav b{font-size:20px;display:block}
.pav small{font-size:13px;color:#E9D5FF}
.stats{display:flex;background:rgba(0,0,0,.25);border-radius:16px;padding:12px 0}
.stat{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat+.stat{border-left:1px solid rgba(255,255,255,.12)}
.stat b{font-size:20px;font-weight:800}
.stat span{font-size:12px;color:#E9D5FF}
.glabel{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:22px 20px 8px}
.grp{margin:0 20px;background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.item{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 16px;width:100%;border-bottom:1px solid var(--line);font-size:15px;color:var(--text);text-align:left}
.item:last-child{border-bottom:0}
.ib{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.ib svg{width:18px;height:18px}
.val{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.about{text-align:center;color:var(--muted);font-size:12px;padding:20px 30px 0;line-height:1.6}

/* downloads list */
.dl{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.dl .th{width:96px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--sk);flex:0 0 auto}
.dl .th img{width:100%;height:100%;object-fit:cover}
.dl .tx{flex:1;min-width:0}
.dl b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl small{font-size:12px;color:var(--muted)}
.dl .pb{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.dl .pb i{display:block;height:4px;background:var(--grad)}

/* nav */
.nav{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;height:70px;border-radius:24px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;justify-content:space-around;align-items:center;padding:0 6px;max-width:520px;margin:0 auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-width:56px;min-height:52px;justify-content:center}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--acc)}
body.detail .nav{display:none}

/* sheets / modal / toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--s1);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;color:var(--text)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:700;margin-bottom:8px}
.sheet p{font-size:14px;color:var(--muted);line-height:1.6}
.opt{display:flex;justify-content:space-between;align-items:center;min-height:52px;width:100%;border-bottom:1px solid var(--line);font-size:15px;color:var(--text);text-align:left}
.opt:last-child{border-bottom:0}
.opt span:last-child{color:var(--muted);font-size:14px}
.opt.on span:last-child{color:var(--acc);font-weight:600}
.sheet input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:14px;margin:12px 0;-webkit-user-select:text;user-select:text}
.sheet .row2{display:flex;gap:10px;margin-top:8px}
.sheet .row2 button{flex:1;height:48px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.modal.on{display:flex}
.modal .frame{width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.modal iframe{width:100%;height:100%;border:0}
.modal .x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}
.modal .yt{color:#fff;opacity:.8;font-size:13px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* player */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;color:#fff;touch-action:manipulation}
#player.on{display:block}
#player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#player .ui{position:absolute;inset:0;transition:opacity .25s;background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 70%,rgba(0,0,0,.7))}
#player.hide .ui{opacity:0;pointer-events:none}
#player.locked .ui{opacity:0;pointer-events:none}
.ptop{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.ptop .l,.ptop .r{display:flex;gap:2px;align-items:center}
.pib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pib svg{width:22px;height:22px}
.ptitle2{font-size:14px;font-weight:600;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.pmid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:48px}
.skip{position:relative;width:52px;height:52px;display:grid;place-items:center;color:#fff}
.skip svg{width:32px;height:32px;stroke-width:1.8}
.skip b{position:absolute;font-size:10px;font-weight:700}
.pp{width:66px;height:66px;border-radius:50%;background:var(--grad2);display:grid;place-items:center;color:#fff}
.pp svg{width:26px;height:26px;fill:#fff;stroke:none}
.pbot{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:flex;align-items:center;gap:10px;font-size:12px;font-variant-numeric:tabular-nums}
.seek{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.seek::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#C026D3 var(--p,0%),rgba(255,255,255,.28) var(--p,0%))}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 4px rgba(217,70,239,.35)}
.unlock{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 40px);transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:12px 18px;border-radius:30px;background:rgba(255,255,255,.15);color:#fff;font-size:14px;font-weight:600}
#player.locked.showlock .unlock{display:flex}
.pbuf{position:absolute;left:50%;top:50%;margin:-20px 0 0 -20px;width:40px;height:40px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#E879F9;animation:sp .8s linear infinite;display:none}
#player.buf .pbuf{display:block}
.seekhint{position:absolute;top:50%;transform:translateY(-50%);padding:10px 16px;border-radius:30px;background:rgba(0,0,0,.55);font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
.seekhint.on{opacity:1}
#player.pip .ui,#player.pip .unlock{display:none}
#player .sheetwrap{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#player .sheetwrap.on{display:flex}
#player .sheet{background:#181A1F;border-color:#2A2D35;color:#F4F4F6}
#player .sheet .opt{border-color:#262930;color:#F4F4F6}
video::cue{background:rgba(0,0,0,.6);color:#fff}
video.cs-s::cue{font-size:14px}
video.cs-m::cue{font-size:19px}
video.cs-l::cue{font-size:25px}
video.cs-y::cue{color:#FDE047}
</style>
</head>
<body>

<section class="view" id="v-home"></section>
<section class="view" id="v-explore"></section>
<section class="view" id="v-kdrama"></section>
<section class="view" id="v-anime"></section>
<section class="view" id="v-profile"></section>
<section class="view" id="v-list"></section>
<section class="view" id="v-detail"></section>

<nav class="nav" id="nav">
  <button data-go="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5H10V14h4v5.5h4.5V10"/></svg><span data-t="home"></span></button>
  <button data-go="explore"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg><span data-t="explore"></span></button>
  <button data-go="kdrama"><svg class="i" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>K-Drama</span></button>
  <button data-go="anime"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l2.2 5.3 5.3 2.2-5.3 2.2L12 18.5l-2.2-5.3L4.5 11l5.3-2.2z"/></svg><span data-t="anime"></span></button>
  <button data-go="profile"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg><span data-t="profile"></span></button>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="tmodal">
  <button class="x" id="tclose" aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="frame" id="tframe"></div>
  <button class="yt" id="tyt">YouTube-এ খুলুন ↗</button>
</div>

<div id="player">
  <video id="pv" playsinline preload="auto" crossorigin="anonymous"></video>
  <div class="pbuf"></div>
  <div class="seekhint" id="shl" style="left:12%">-10s</div>
  <div class="seekhint" id="shr" style="right:12%">+10s</div>
  <div class="ui" id="pui">
    <div class="ptop">
      <div class="l">
        <button class="pib" data-p="close" aria-label="close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <span class="ptitle2" id="ptitle"></span>
      </div>
      <div class="r">
        <button class="pib" data-p="pip" aria-label="picture in picture"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="11" width="7" height="6" rx="1.2" fill="currentColor"/></svg></button>
        <button class="pib" data-p="lock" aria-label="lock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></button>
        <button class="pib" data-p="aspect" aria-label="aspect"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M7 9v-.5h3M17 15v.5h-3"/></svg></button>
        <button class="pib" data-p="full" aria-label="fullscreen"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
        <button class="pib" data-p="settings" aria-label="settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      </div>
    </div>
    <div class="pmid">
      <button class="skip" data-p="back10" aria-label="back 10"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg><b>10</b></button>
      <button class="pp" data-p="toggle" aria-label="play pause" id="ppbtn"></button>
      <button class="skip" data-p="fwd10" aria-label="forward 10"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg><b>10</b></button>
    </div>
    <div class="pbot">
      <span id="pcur">0:00</span>
      <input class="seek" id="pseek" type="range" min="0" max="1000" value="0" aria-label="seek">
      <span id="pdur">0:00</span>
    </div>
  </div>
  <button class="unlock" data-p="unlock"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 7.5-2"/></svg><span>আনলক</span></button>
  <div class="sheetwrap" id="psw"><div class="sheet" id="psheet"></div></div>
  <input type="file" id="subfile" accept=".srt,.vtt,text/plain,application/x-subrip" hidden>
</div>

<input type="file" id="vidfile" accept="video/*" hidden>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
