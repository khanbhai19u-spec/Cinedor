name: Build Cinedor (Android)

on:
  push:
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (যেমন 2.1.0) — খালি রাখলে নিজে থেকে নম্বর বসবে"
        required: false
        default: ""
      notes:
        description: "কী নতুন"
        required: false
        default: "Cinedor update"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      IN_VERSION: ${{ inputs.version }}
      RUN_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VER="${IN_VERSION#v}"
          [ -z "$VER" ] && VER="2.1.$RUN_NO"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 2.0.0"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$(( 10#$MA * 1000000 + 10#$MI * 10000 + 10#$PA ))" >> "$GITHUB_ENV"

      - name: TMDB key check
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY secret নেই — অ্যাপে TMDB key বিল্ট-ইন থাকবে না (Settings › App Settings-এ দিতে হবে)"
          else
            echo "TMDB key: set (hidden)"
          fi

      - name: Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret নেই — debug key দিয়ে সাইন হবে (পরের আপডেট ইনস্টলে সমস্যা হতে পারে)"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleRelease -PvName="$VER" -PvCode="$CODE" --no-daemon --stacktrace

      - name: Rename
        run: cp android/build/outputs/apk/release/app-release.apk "Cinedor-v$VER.apk"

      - name: Upload APK (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Cinedor-v${{ env.VER }}
          path: Cinedor-v${{ env.VER }}.apk

      - name: Publish release
        # Every push to main (and every manual run) publishes a GitHub Release with the APK
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Cinedor v${{ env.VER }}
          body: |
            ${{ inputs.notes || github.event.head_commit.message || 'Cinedor update' }}

            ডাউনলোড: নিচের Cinedor-v${{ env.VER }}.apk
          files: Cinedor-v${{ env.VER }}.apk
          make_latest: true

      - name: Clean
        if: always()
        run: rm -f android/release.jks || true
