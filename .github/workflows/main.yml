name: Build Cinedor (Android)

on:
  push:
    paths:
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (যেমন 2.0.0) — প্রতিবার বাড়াবে"
        required: true
        default: "2.0.0"
      notes:
        description: "কী নতুন"
        required: false
        default: "Cinedor update"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      IN_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          VER="${IN_VERSION#v}"
          [ -z "$VER" ] && VER="2.0.0"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 2.0.0"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#$PA ))" >> "$GITHUB_ENV"

      - name: Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          else
            echo "::warning::KEYSTORE_BASE64 secret নেই — debug key দিয়ে সাইন হবে (পরের আপডেট ইনস্টলে সমস্যা হতে পারে)"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleRelease -PvName="$VER" -PvCode="$CODE" --no-daemon --stacktrace

      - name: Rename
        run: cp android/build/outputs/apk/release/app-release.apk "Cinedor-v$VER.apk"

      - name: Upload APK (download from the run page)
        uses: actions/upload-artifact@v4
        with:
          name: Cinedor-v${{ env.VER }}
          path: Cinedor-v${{ env.VER }}.apk

      - name: Publish release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: player-v${{ env.VER }}
          name: Cinedor v${{ env.VER }}
          body: ${{ inputs.notes }}
          files: Cinedor-v${{ env.VER }}.apk
          make_latest: false

      - name: Clean
        if: always()
        run: rm -f android/release.jks || true
