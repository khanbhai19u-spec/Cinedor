name: Build & Release Cinedor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "নতুন ভার্সন (যেমন 1.0.1) — আগেরটার চেয়ে বড় হতে হবে"
        required: true
        default: "1.0.0"
      notes:
        description: "এই আপডেটে কী নতুন"
        required: false
        default: "Bug fixes and improvements"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      IN_VERSION: ${{ inputs.version }}
      IN_NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          [ -z "$KEYSTORE_BASE64" ] && echo "::error::Secret KEYSTORE_BASE64 নেই (Settings → Secrets and variables → Actions)" && missing=1
          [ -z "$KEYSTORE_PASSWORD" ] && echo "::error::Secret KEYSTORE_PASSWORD নেই" && missing=1
          [ -z "$TMDB_API_KEY" ] && echo "::warning::Secret TMDB_API_KEY নেই — অ্যাপের Profile থেকে key দিতে হবে"
          exit $missing

      - name: Version
        run: |
          VER="${IN_VERSION#v}"
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.0.1"; exit 1; fi
          IFS=. read -r MA MI PA <<< "$VER"
          CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#$PA ))
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "Building v$VER (code $CODE)"

      - name: Write config + keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          python3 - <<'PY'
          import json, os
          cfg = {"tmdbKey": os.environ.get("TMDB_API_KEY", ""), "repo": os.environ["GITHUB_REPOSITORY"]}
          open("app/src/main/assets/www/config.js", "w").write("window.CINEDOR_CONFIG = " + json.dumps(cfg) + ";\n")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleRelease -PvName="$VER" -PvCode="$CODE" --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "Cinedor-v$VER.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Cinedor v${{ env.VER }}
          body: ${{ env.IN_NOTES }}
          files: Cinedor-v${{ env.VER }}.apk
          make_latest: true

      - name: Clean
        if: always()
        run: rm -f app/release.jks
